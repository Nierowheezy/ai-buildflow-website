<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">AI BuildFlow</title>
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155eef"/>
      <stop offset="100%" stop-color="#3975ff"/>
    </linearGradient>
    <linearGradient id="brandGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3975ff"/>
      <stop offset="100%" stop-color="#7aa2ff"/>
    </linearGradient>
  </defs>
  <!-- Background circle for app icon contexts -->
  <circle cx="32" cy="32" r="30" fill="url(#brandGrad)" opacity="0.08"/>
  <!-- Main mark: stylized flow bracket + AI node -->
  <g fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket (file/code) -->
    <path d="M16 14v36M16 14h10M16 50h10"/>
    <!-- Flow arrow through center -->
    <path d="M28 32h8M36 28l4 4-4 4"/>
    <!-- Right bracket (output/result) -->
    <path d="M48 14v36M48 14h-10M48 50h-10"/>
    <!-- AI spark/node at center -->
    <circle cx="32" cy="32" r="3" fill="url(#brandGrad)"/>
    <!-- Spark accents -->
    <path d="M32 24v3M29 27h6M32 38v3M29 41h6" stroke-width="1.5"/>
  </g>
</svg>